[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spinn"
version = "0.1.0"
description = "Spintronic neural network simulator: ideal crossbar design in Python, handed off to a MATLAB as-built device-error model."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "h5py>=3.10",       # the handoff; not yet written
    "matplotlib>=3.8",  # budget figures; not yet drawn
]
# torch was removed rather than installed. The model is one 36x10 linear map and
# the gradient of softmax cross-entropy through it is `X.T @ (p - Y)`; autograd for
# one line of calculus is not worth the largest dependency in the project. scipy
# went the same way -- nothing imported it. See docs/history.md.

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# spinn-hw/ is MATLAB and is deliberately not a Python package.
[tool.setuptools]
packages = ["spinn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# The suite runs against the working tree rather than an installed copy. `apps` is
# imported by the site tests and is deliberately not a declared package, so an
# editable install would put `spinn` on the path and leave `apps` off it.
pythonpath = ["."]
